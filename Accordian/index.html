
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="accordion">

        <h3>Frequently Asked Questions</h3>

        <!-- HTML -->
        <div class="accordion-item HTML">

            <div class="accordion-header">
                <h3>What is HTML?</h3>
                <span class="arrow"></span>
            </div>

            <div class="accordion-content html">
            </div>

        </div>

        <!-- CSS -->
        <div class="accordion-item CSS">

            <div class="accordion-header">
                <h3>What is CSS?</h3>
                <span class="arrow"></span>
            </div>

            <div class="accordion-content css">
            </div>

        </div>

        <!-- JavaScript -->
        <div class="accordion-item JavaScript">

            <div class="accordion-header">
                <h3>What is JavaScript?</h3>
                <span class="arrow"></span>
            </div>

            <div class="accordion-content JavaScript">
            </div>

        </div>

        <p>Try clicking each heading to expand or collapse its answer.</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
