<!DOCTYPE html>
<html>

<head>
    <title>JavaScript</title>
    <style>
        .btn {
            background-color: #2563eb;
            /* Clean blue background */
            color: #ffffff;
            /* White text */
            padding: 10px 20px;
            /* Comfortable spacing inside */
            font-size: 16px;
            /* Readable text size */
            font-family: sans-serif;
            /* Clean font */
            font-weight: 500;
            border: none;
            /* Removes default ugly border */
            border-radius: 6px;
            /* Slightly rounded corners */
            cursor: pointer;
            /* Shows hand pointer on hover */
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Darkens slightly when hovered */
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
